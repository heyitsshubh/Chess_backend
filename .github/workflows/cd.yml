# =============================================================
# CD — Continuous Deployment (Backend Services)
#
# Triggers: push to main after CI passes.
#
# Pipeline:
#  1. Build Docker images for auth-service and game-service
#  2. Push images to GitHub Container Registry (GHCR)
#  3. Tag: latest + short SHA (e.g. sha-a1b2c3d)
#  4. Deploy to production (SSH + docker compose pull + up)
#
# Required Secrets:
#   DEPLOY_HOST         — SSH host / IP of your server
#   DEPLOY_USER         — SSH user (e.g. ubuntu)
#   DEPLOY_SSH_KEY      — Private SSH key (PEM)
#   DEPLOY_PATH         — Path to project on server (e.g. /opt/chess)
# =============================================================

name: CD — Backend Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false     # Never cancel an in-flight deploy

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & push auth-service Docker image
  # ─────────────────────────────────────────────────────────────
  build-auth:
    name: Build auth-service image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/chess-auth-service
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build & push game-service Docker image
  # ─────────────────────────────────────────────────────────────
  build-game:
    name: Build game-service image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/chess-game-service
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ─────────────────────────────────────────────────────────────
  # Job 3: Deploy to server via SSH
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [build-auth, build-game]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://chess.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📦 Pulling latest images..."
            docker pull ghcr.io/${{ github.repository_owner }}/chess-auth-service:latest
            docker pull ghcr.io/${{ github.repository_owner }}/chess-game-service:latest

            echo "🔄 Restarting services..."
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps \
              auth-service game-service

            echo "🔍 Verifying health..."
            sleep 5
            curl -sf http://localhost/auth/health || exit 1
            curl -sf http://localhost/game/health || exit 1

            echo "✅ Deploy complete — sha ${{ github.sha }}"

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *chess-platform* deployed to `${{ github.event.inputs.environment || 'production' }}` — <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
