# =============================================================
# CI — Continuous Integration
# Triggers: push to main/develop/feat/fix, PRs to main/develop
# =============================================================

name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Install deps, lint, typecheck, build, test — all in one
  # Combining jobs avoids artifact-sharing complexity across runners.
  # ─────────────────────────────────────────────────────────────
  check:
    name: Lint · TypeCheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: TypeCheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test

  # ─────────────────────────────────────────────────────────────
  # Job 2: Integration test — only on main/develop
  # Spins up real Postgres + Redis service containers.
  # ─────────────────────────────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: chess_password
          POSTGRES_DB: chess_db
          POSTGRES_USER: chess_admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://chess_admin:chess_password@localhost:5432/chess_auth_db
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ci-refresh-secret-min-32-characters
      REFRESH_TOKEN_EXPIRES_IN: 7d
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_dummy_key' }}
      EMAIL_FROM: noreply@chess.test
      GRPC_PORT: 50051
      GAME_DATABASE_URL: postgresql://chess_admin:chess_password@localhost:5432/chess_game_db
      AUTH_GRPC_HOST: localhost
      AUTH_GRPC_PORT: 50051

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install postgres client
        run: sudo apt-get install -y postgresql-client

      - name: Create databases
        run: |
          PGPASSWORD=chess_password psql -h localhost -U chess_admin -d chess_db \
            -c "CREATE DATABASE chess_auth_db;"
          PGPASSWORD=chess_password psql -h localhost -U chess_admin -d chess_db \
            -c "CREATE DATABASE chess_game_db;"

      - name: Run Prisma migrations
        run: |
          pnpm --filter @chess/auth-service exec prisma migrate deploy
          pnpm --filter @chess/game-service exec prisma migrate deploy

      - name: Build all services
        run: pnpm turbo run build

      - name: Run integration test
        run: npx ts-node integration_test.ts
        timeout-minutes: 3
