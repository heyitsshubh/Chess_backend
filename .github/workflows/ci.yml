# =============================================================
# CI — Continuous Integration
#
# Triggers: every push to main/develop and every pull request.
# Jobs run in parallel where possible via Turborepo.
#
# Pipeline:
#  1. Lint         – ESLint across all packages
#  2. Typecheck    – tsc --noEmit across all packages
#  3. Build        – Compile all packages + services
#  4. Test         – Vitest unit tests for engine, auth, game
#  5. Integration  – E2E test against live infra (main only)
# =============================================================

name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Lint all packages
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm turbo run lint --cache-dir=.turbo

      - name: Check commit messages (PR only)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ─────────────────────────────────────────────────────────────
  # Job 2: TypeScript type-checking
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run TypeScript compiler (no emit)
        run: pnpm turbo run typecheck --cache-dir=.turbo

  # ─────────────────────────────────────────────────────────────
  # Job 3: Build all packages and services
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build --cache-dir=.turbo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            apps/auth-service/dist
            apps/game-service/dist
            packages/*/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 4: Unit tests (depends on build for proper module resolution)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: Chess Engine
            filter: '@chess/engine'
          - name: Auth Service
            filter: '@chess/auth-service'
          - name: Game Service
            filter: '@chess/game-service'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests — ${{ matrix.package.name }}
        run: pnpm --filter "${{ matrix.package.filter }}" test -- --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.package.filter }}-${{ github.sha }}
          path: '**/coverage/'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 5: Integration test (main branch only — needs real infra)
  # ─────────────────────────────────────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: chess_password
          POSTGRES_DB: chess_db
          POSTGRES_USER: chess_admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Auth Service
      DATABASE_URL: postgresql://chess_admin:chess_password@localhost:5432/chess_auth_db
      JWT_SECRET: ci-jwt-secret-min-32-characters-long
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ci-refresh-secret-min-32-characters
      REFRESH_TOKEN_EXPIRES_IN: 7d
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: noreply@chess.test
      GRPC_PORT: 50051
      # Game Service
      GAME_DATABASE_URL: postgresql://chess_admin:chess_password@localhost:5432/chess_game_db
      AUTH_GRPC_HOST: localhost
      AUTH_GRPC_PORT: 50051

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create auth database
        run: |
          PGPASSWORD=chess_password psql -h localhost -U chess_admin -d chess_db \
            -c "CREATE DATABASE chess_auth_db;"

      - name: Create game database
        run: |
          PGPASSWORD=chess_password psql -h localhost -U chess_admin -d chess_db \
            -c "CREATE DATABASE chess_game_db;"

      - name: Run Prisma migrations
        run: |
          pnpm --filter @chess/auth-service exec prisma migrate deploy
          pnpm --filter @chess/game-service exec prisma migrate deploy

      - name: Build all services
        run: pnpm turbo run build

      - name: Run integration test
        run: npx ts-node integration_test.ts
        timeout-minutes: 3

  # ─────────────────────────────────────────────────────────────
  # Summary gate — required to pass before merging
  # ─────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
