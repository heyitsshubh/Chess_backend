# =============================================================
# Production Docker Compose
#
# Uses pre-built images from GHCR (pushed by CD workflow).
# Run on your server: docker compose -f docker-compose.prod.yml up -d
#
# Env file: .env.production (not committed — copy from .env.example)
# =============================================================

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:14-alpine
    container_name: chess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-chess_admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [chess-net]

  redis:
    image: redis:7-alpine
    container_name: chess_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [chess-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chess_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [chess-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: chess_kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [chess-net]

  # ─────────────────────────────────────────────────────────
  # Application Services (images from GHCR)
  # ─────────────────────────────────────────────────────────
  auth-service:
    image: ghcr.io/${GHCR_OWNER}/chess-auth-service:latest
    container_name: chess_auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.auth
    environment:
      NODE_ENV: production
    networks: [chess-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/auth/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  game-service:
    image: ghcr.io/${GHCR_OWNER}/chess-game-service:latest
    container_name: chess_game
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      auth-service:
        condition: service_healthy
    env_file: .env.game
    environment:
      NODE_ENV: production
    networks: [chess-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/game/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: chess_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      auth-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
    networks: [chess-net]

  # ─────────────────────────────────────────────────────────
  # SSL Certificate Renewal (Let's Encrypt)
  # ─────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: chess_certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: renew --webroot -w /var/www/certbot
    networks: [chess-net]

volumes:
  postgres_data:
  redis_data:
  certbot_www:

networks:
  chess-net:
    driver: bridge
